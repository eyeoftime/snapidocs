# Weekly data refresh and deploy to GitHub Pages.
# Inert until this project is pushed to GitHub with Pages set to "GitHub Actions" as its source.
name: Refresh API data

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'package.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      # Always start from the current tip of main. A re-run would otherwise check out the commit the run first
      # started on, and its data commit could never be pushed once main had moved on.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache
          key: docs-cache-${{ github.run_id }}
          restore-keys: docs-cache-
      # A failed release keeps its previous data; the step fails so the problem is visible.
      - name: Refresh data
        if: github.event_name != 'push'
        run: npm run refresh
      - run: npm run check
      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh API reference data"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub's Pages deployment API fails now and then ("no artifact found", HTTP 500); try once more.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
