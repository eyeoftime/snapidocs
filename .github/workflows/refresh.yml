# Weekly data refresh and deploy to GitHub Pages.
# Inert until this project is pushed to GitHub with Pages set to "GitHub Actions" as its source.
name: Refresh API data

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'package.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache
          key: docs-cache-${{ github.run_id }}
          restore-keys: docs-cache-
      # A failed release keeps its previous data; the step fails so the problem is visible.
      - name: Refresh data
        if: github.event_name != 'push'
        run: npm run refresh
      - run: npm run check
      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Refresh API reference data"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
